<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>Prenotazioni</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div class="views-container">

      <!-- ===== HOME VIEW ===== -->
      <section class="view active" id="viewHome">

        <div class="sticky-top">
          <header class="app-header">
            <div class="header-left">
              <p class="app-eyebrow">Gestionale</p>
              <h1 class="app-title">Prenotazioni</h1>
            </div>
            <button class="btn-today" id="btnGoToday" title="Torna ad oggi">Oggi</button>
          </header>

          <div class="day-navigator" id="dayNavigator">
            <button class="day-nav-btn" id="btnPrevDay" aria-label="Giorno precedente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="day-display">
              <span class="day-label" id="dayLabel">Sabato</span>
              <div class="day-date-wrap">
                <div class="day-separator"></div>
                <span class="day-date-sub" id="dayDateSub">30 Agosto 2026</span>
              </div>
            </div>
            <button class="day-nav-btn" id="btnNextDay" aria-label="Giorno successivo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>

        <!-- Pranzo -->
        <div class="service-section">
          <div class="service-hdr lunch-hdr">
            <div class="service-hdr-left">
              <span class="service-emoji">☀️</span>
              <span class="service-name">Pranzo</span>
            </div>
            <span class="service-chip" id="lunchChip">0 coperti</span>
          </div>
          <div class="reservations-list" id="lunchList"></div>
          <button class="add-res-btn add-lunch" data-service="lunch">
            <span class="add-plus">＋</span> Aggiungi prenotazione
          </button>
        </div>

        <div class="service-divider"></div>

        <!-- Cena -->
        <div class="service-section" style="margin-bottom:24px">
          <div class="service-hdr dinner-hdr">
            <div class="service-hdr-left">
              <span class="service-emoji">🌙</span>
              <span class="service-name">Cena</span>
            </div>
            <span class="service-chip" id="dinnerChip">0 coperti</span>
          </div>
          <div class="reservations-list" id="dinnerList"></div>
          <button class="add-res-btn add-dinner" data-service="dinner">
            <span class="add-plus">＋</span> Aggiungi prenotazione
          </button>
        </div>

      </section>

      <!-- ===== CALENDAR VIEW ===== -->
      <section class="view" id="viewCalendar">

        <header class="app-header">
          <div class="header-left">
            <p class="app-eyebrow">Vista mensile</p>
            <h1 class="app-title">Calendario</h1>
          </div>
        </header>

        <div class="cal-wrap">
          <div class="cal-nav-row">
            <button class="cal-nav-btn" id="btnPrevMonth">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h2 class="cal-month-title" id="calMonthTitle">Agosto 2026</h2>
            <button class="cal-nav-btn" id="btnNextMonth">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <div class="cal-weekdays">
            <span>Lun</span><span>Mar</span><span>Mer</span>
            <span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>

          <div class="cal-legend">
            <span class="legend-item"><span class="legend-dot lunch-dot"></span>Pranzo</span>
            <span class="legend-item"><span class="legend-dot dinner-dot"></span>Cena</span>
          </div>
        </div>

      </section>

    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Oggi</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Calendario</span>
      </button>
    </nav>

  </div>

  <!-- MODAL BOTTOM SHEET -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">
        <h2 class="sheet-title" id="sheetTitle">Nuova prenotazione</h2>
        <button class="sheet-close-btn" id="btnCloseModal" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="reservationForm" class="sheet-form" novalidate autocomplete="off">
        <input type="hidden" id="formId">

        <div class="field-row">
          <div class="field-group half">
            <label class="field-lbl" for="formDate">Data</label>
            <input type="date" class="field-input" id="formDate" required>
            <span class="date-day-label" id="formDateDay"></span>
          </div>
          <div class="field-group half">
            <label class="field-lbl">Servizio</label>
            <div class="svc-toggle" id="svcToggle">
              <button type="button" class="svc-btn active" data-value="lunch">☀️ Pranzo</button>
              <button type="button" class="svc-btn" data-value="dinner">🌙 Cena</button>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-lbl" for="formName">Nome prenotazione</label>
          <input type="text" class="field-input" id="formName"
                 placeholder="Es. Rossi, Bianchi, Tavolo 3…"
                 required maxlength="60" autocorrect="off" spellcheck="false">
        </div>

        <div class="field-group">
          <label class="field-lbl">Adulti</label>
          <div class="stepper-wrap">
            <button type="button" class="step-btn" id="btnDecAdults" aria-label="Diminuisci adulti">−</button>
            <div class="step-display">
              <input type="number" class="step-input" id="stepAdults" value="2" min="0" max="99" inputmode="numeric">
              <span class="step-unit">adulti</span>
            </div>
            <button type="button" class="step-btn" id="btnIncAdults" aria-label="Aumenta adulti">+</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-lbl">Bambini</label>
          <div class="stepper-wrap">
            <button type="button" class="step-btn" id="btnDecChildren" aria-label="Diminuisci bambini">−</button>
            <div class="step-display">
              <input type="number" class="step-input" id="stepChildren" value="0" min="0" max="99" inputmode="numeric">
              <span class="step-unit">bambini</span>
            </div>
            <button type="button" class="step-btn" id="btnIncChildren" aria-label="Aumenta bambini">+</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-lbl" for="formNotes">
            Note <span class="field-optional">(opzionale)</span>
          </label>
          <textarea class="field-textarea" id="formNotes"
                    placeholder="Allergie, occasione speciale, richieste particolari…"
                    rows="3" maxlength="500"></textarea>
        </div>

        <div class="sheet-actions">
          <button type="button" class="btn-delete hidden" id="btnDeleteRes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
              <path d="M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
            </svg>
            Elimina
          </button>
          <button type="submit" class="btn-save" id="btnSaveRes">Salva prenotazione</button>
        </div>
      </form>
    </div>
  </div>

  <!-- VOICE BUTTON -->
  <button class="voice-fab hidden" id="voiceFab" aria-label="Prenotazione vocale">
    <svg id="voiceIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10a7 7 0 0014 0"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
    </svg>
  </button>

  <!-- VOICE TOAST -->
  <div class="voice-toast hidden" id="voiceToast">
    <span class="voice-dot"></span>
    <span id="voiceToastText">In ascolto…</span>
  </div>

  <!-- CONFIRM DIALOG -->
  <div class="confirm-overlay hidden" id="confirmOverlay">
    <div class="confirm-box">
      <p class="confirm-msg" id="confirmMsg">Eliminare questa prenotazione?</p>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="confirmCancel">Annulla</button>
        <button class="confirm-ok" id="confirmOk">Elimina</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
